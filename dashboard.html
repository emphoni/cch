<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cch - Session Manager</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script>
    // Apply theme BEFORE anything renders to avoid flash
    (function() {
      const t = localStorage.getItem('cch-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/vendor/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void:          'var(--void)',
            surface:       'var(--surface)',
            raised:        'var(--raised)',
            border:        'var(--border)',
            'border-bright':'var(--border-bright)',
            muted:         'var(--muted)',
            subtle:        'var(--subtle)',
            primary:       'var(--primary)',
            bright:        'var(--bright)',
            accent:        'var(--accent)',
            'accent-glow': 'var(--accent-glow)',
            danger:        'var(--danger)',
            'danger-dim':  'var(--danger-dim)',
          },
          fontFamily: {
            sans: ['Outfit', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    }
  </script>
  <style>
    :root[data-theme="dark"] {
      --void: #000000;
      --surface: #050505;
      --raised: #0a0a0a;
      --border: #0e0e0e;
      --border-bright: #151515;
      --muted: #555555;
      --subtle: #777777;
      --primary: #cccccc;
      --bright: #f0f0f0;
      --accent: #ffffff;
      --accent-glow: rgba(255,255,255,0.08);
      --danger: #ff4444;
      --danger-dim: rgba(255,68,68,0.10);
      --row-hover: #0a0a0a;
      --sidebar-active: #0f0f0f;
      --kbd-bg: #111;
      --kbd-border: #2a2a2a;
      --kbd-color: #555;
      --scrollbar: #222;
      --scrollbar-hover: #333;
      --focus-ring: #fff;
      --focus-glow: rgba(255,255,255,0.08);
      --grain-opacity: 0.02;
    }
    :root[data-theme="light"] {
      --void: #ffffff;
      --surface: #fafafa;
      --raised: #f5f5f5;
      --border: #e5e5e5;
      --border-bright: #d5d5d5;
      --muted: #999999;
      --subtle: #777777;
      --primary: #333333;
      --bright: #111111;
      --accent: #000000;
      --accent-glow: rgba(0,0,0,0.05);
      --danger: #dd2222;
      --danger-dim: rgba(221,34,34,0.08);
      --row-hover: #f5f5f5;
      --sidebar-active: #efefef;
      --kbd-bg: #eee;
      --kbd-border: #d5d5d5;
      --kbd-color: #999;
      --scrollbar: #ddd;
      --scrollbar-hover: #ccc;
      --focus-ring: #000;
      --focus-glow: rgba(0,0,0,0.06);
      --grain-opacity: 0.015;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--void); }
    body { background: var(--void); min-height: 100vh; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: var(--grain-opacity);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    @keyframes rowIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .row-animate { animation: rowIn 0.3s ease-out both; }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(6px) scale(0.97); }
    }
    .toast-in { animation: toastIn 0.25s ease-out both; }
    .toast-out { animation: toastOut 0.2s ease-in both; }

    input:focus { outline: none; box-shadow: 0 0 0 1px var(--focus-ring), 0 0 0 3px var(--focus-glow); }

    .session-row { transition: background 0.15s ease; }
    .session-row:hover { background: var(--row-hover); }
    .session-row:hover .row-actions { opacity: 1; }
    .row-actions { opacity: 0; transition: opacity 0.15s ease; }

    .kbd {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      background: var(--kbd-bg);
      border: 1px solid var(--kbd-border);
      color: var(--kbd-color);
      font-family: 'JetBrains Mono', monospace;
    }

    .confirm-bar { animation: rowIn 0.15s ease-out both; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    .pulse-dot { animation: pulse 2s ease-in-out infinite; }

    .sidebar-item { transition: background 0.12s ease, color 0.12s ease; }
    .sidebar-item:hover { background: var(--row-hover); }
    .sidebar-item.active { background: var(--sidebar-active); color: var(--bright); }

    /* Markdown prose */
    .md-prose { line-height: 1.6; }
    .md-prose h1, .md-prose h2, .md-prose h3 { color: var(--bright); font-weight: 500; margin: 0.8em 0 0.4em; }
    .md-prose h1 { font-size: 1.25em; }
    .md-prose h2 { font-size: 1.1em; }
    .md-prose h3 { font-size: 1em; }
    .md-prose p { margin: 0.4em 0; }
    .md-prose ul, .md-prose ol { margin: 0.4em 0; padding-left: 1.5em; }
    .md-prose li { margin: 0.15em 0; }
    .md-prose code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background: var(--raised); border: 1px solid var(--border); border-radius: 3px; padding: 0.1em 0.35em; }
    .md-prose pre { margin: 0.6em 0; background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 0.75em 1em; overflow-x: auto; }
    .md-prose pre code { background: none; border: none; padding: 0; font-size: 0.8em; }
    .md-prose strong { color: var(--bright); font-weight: 600; }
    .md-prose a { color: var(--accent); text-decoration: underline; }
    .md-prose hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
    .md-prose table { width: 100%; border-collapse: collapse; margin: 0.6em 0; font-size: 0.85em; }
    .md-prose th, .md-prose td { border: 1px solid var(--border); padding: 0.4em 0.75em; text-align: left; }
    .md-prose th { background: var(--raised); color: var(--bright); font-weight: 500; }
    .md-prose blockquote { border-left: 2px solid var(--border-bright); padding-left: 0.75em; margin: 0.5em 0; color: var(--subtle); }

    /* Theme toggle */
    .theme-toggle { transition: opacity 0.15s ease; }
    .theme-toggle:hover { opacity: 0.7; }

    /* Danger toggle switch */
    .toggle-track {
      width: 28px; height: 16px;
      border-radius: 8px;
      background: var(--border-bright);
      position: relative;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .toggle-track.on { background: var(--danger); }
    .toggle-track .toggle-knob {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--bright);
      position: absolute;
      top: 2px; left: 2px;
      transition: transform 0.2s ease;
    }
    .toggle-track.on .toggle-knob { transform: translateX(12px); }
  </style>
</head>
<body class="font-sans text-primary antialiased">

  <div class="relative z-10 flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-56 shrink-0 border-r border-border flex flex-col py-6 px-3 sticky top-0 h-screen overflow-y-auto">
      <!-- Logo + theme toggle -->
      <div class="flex items-center justify-between px-2 mb-8">
        <div class="flex items-center gap-2.5">
          <div class="w-6 h-6 rounded-md bg-accent-glow border border-border-bright flex items-center justify-center">
            <span class="font-mono text-accent text-[10px] font-semibold">></span>
          </div>
          <span class="font-mono text-accent text-sm font-medium tracking-tight">cch</span>
        </div>
        <button onclick="toggleTheme()" class="theme-toggle p-1 rounded-md text-muted" title="Toggle theme">
          <!-- Sun icon (shown in dark mode) -->
          <svg id="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <!-- Moon icon (shown in light mode) -->
          <svg id="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>

      <!-- All sessions -->
      <div class="mb-6">
        <button id="nav-all" onclick="selectFilter('all')" class="sidebar-item active w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-md text-xs font-light">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          <span>All Sessions</span>
          <span id="nav-all-count" class="ml-auto font-mono text-muted text-[10px]">0</span>
        </button>
      </div>

      <!-- Directories -->
      <div class="mb-2 px-2.5">
        <span class="text-[10px] font-mono uppercase tracking-widest text-muted/60">Directories</span>
      </div>
      <div id="sidebar-dirs" class="flex flex-col gap-0.5 flex-1 min-h-0 overflow-y-auto"></div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 min-w-0 py-8 px-8">
      <!-- Header bar -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h2 id="main-title" class="text-bright text-sm font-medium">All Sessions</h2>
        </div>
        <div class="flex items-center gap-4 text-muted text-xs">
          <div class="flex items-center gap-2">
            <span id="danger-label" class="font-mono text-[11px] text-muted">safe</span>
            <div id="danger-toggle" onclick="toggleDangerous()" class="toggle-track" title="Toggle --dangerously-skip-permissions">
              <div class="toggle-knob"></div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="pulse-dot w-1.5 h-1.5 rounded-full bg-accent inline-block"></span>
            <span id="session-count" class="font-mono">0 sessions</span>
            <a href="/api/db" title="Download sessions.db" class="p-1 rounded-md hover:bg-accent-glow text-muted hover:text-accent transition-all">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
              </svg>
            </a>
          </div>
        </div>
      </div>

      <!-- Search -->
      <div class="mb-6 relative">
        <div class="absolute left-3 top-1/2 -translate-y-1/2 text-muted pointer-events-none">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
        </div>
        <input
          id="search"
          type="text"
          placeholder="Filter sessions…"
          class="w-full bg-raised border border-border rounded-lg pl-9 pr-4 py-2.5 text-sm text-primary placeholder:text-muted/60 font-light tracking-wide transition-all"
        />
        <div class="absolute right-3 top-1/2 -translate-y-1/2">
          <span class="kbd">/</span>
        </div>
      </div>

      <!-- Table header -->
      <div class="flex items-center px-4 py-2 text-[11px] font-mono uppercase tracking-widest text-muted/70 border-b border-border">
        <div class="flex-1">Session</div>
        <div class="w-28 text-right">Time</div>
        <div class="w-24"></div>
      </div>

      <!-- Session list -->
      <div id="session-list" class="divide-y divide-border/60"></div>

      <!-- Empty state -->
      <div id="empty-state" class="hidden py-24 text-center">
        <div class="w-12 h-12 mx-auto mb-4 rounded-xl bg-raised border border-border flex items-center justify-center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="text-muted">
            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="14 2 14 8 20 8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <p class="text-subtle text-sm font-light mb-1">No sessions saved</p>
        <p class="text-muted text-xs font-light font-mono">cch &lt;session-id&gt; "title"</p>
      </div>

      <!-- No results -->
      <div id="no-results" class="hidden py-16 text-center">
        <p class="text-subtle text-sm font-light">No matching sessions</p>
      </div>
    </main>

    <!-- Detail view (hidden by default) -->
    <main id="detail-view" class="hidden flex-1 min-w-0 py-8 px-8 overflow-y-auto">
      <div id="detail-content"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 items-end"></div>

  <script>
    const API = '/api/sessions';
    let sessions = [];
    let deleteConfirm = null;
    let activeFilter = 'all';
    let dangerousMode = localStorage.getItem('cch-dangerous') === 'true';

    // Dangerous toggle
    function updateDangerToggle() {
      const track = document.getElementById('danger-toggle');
      const label = document.getElementById('danger-label');
      track.classList.toggle('on', dangerousMode);
      label.textContent = dangerousMode ? 'skip-perms' : 'safe';
      label.classList.toggle('text-danger', dangerousMode);
      label.classList.toggle('text-muted', !dangerousMode);
    }
    function toggleDangerous() {
      dangerousMode = !dangerousMode;
      localStorage.setItem('cch-dangerous', dangerousMode);
      updateDangerToggle();
    }
    updateDangerToggle();

    // Theme
    function getTheme() {
      return document.documentElement.getAttribute('data-theme') || 'dark';
    }
    function toggleTheme() {
      const next = getTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('cch-theme', next);
      updateThemeIcons();
    }
    function updateThemeIcons() {
      const isDark = getTheme() === 'dark';
      document.getElementById('icon-sun').classList.toggle('hidden', !isDark);
      document.getElementById('icon-moon').classList.toggle('hidden', isDark);
    }
    updateThemeIcons();

    // Elements
    const listEl = document.getElementById('session-list');
    const emptyEl = document.getElementById('empty-state');
    const noResultsEl = document.getElementById('no-results');
    const searchEl = document.getElementById('search');
    const countEl = document.getElementById('session-count');
    const toastContainer = document.getElementById('toast-container');
    const sidebarDirs = document.getElementById('sidebar-dirs');
    const mainTitle = document.getElementById('main-title');
    const navAllCount = document.getElementById('nav-all-count');

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchEl) {
        e.preventDefault();
        searchEl.focus();
      }
      if (e.key === 'Escape') {
        searchEl.blur();
        searchEl.value = '';
        renderFiltered();
      }
    });

    searchEl.addEventListener('input', () => renderFiltered());

    function selectFilter(filter) {
      activeFilter = filter;
      searchEl.value = '';
      if (filter === 'all') {
        history.replaceState(null, '', '/');
      } else {
        history.replaceState(null, '', '/' + dirLabel(filter));
      }
      renderFiltered();
      renderSidebar();
    }

    function getFilteredSessions() {
      let data = sessions;
      if (activeFilter !== 'all') {
        data = data.filter(s => s.pwd === activeFilter);
      }
      const q = searchEl.value.toLowerCase().trim();
      if (q) {
        data = data.filter(s =>
          s.title.toLowerCase().includes(q) ||
          s.id.toLowerCase().includes(q) ||
          s.pwd.toLowerCase().includes(q)
        );
      }
      return data;
    }

    function renderFiltered() {
      const data = getFilteredSessions();
      render(data);
    }

    function timeAgo(dateStr) {
      const now = new Date();
      const date = new Date(dateStr);
      const diff = Math.floor((now - date) / 1000);
      if (diff < 60) return 'just now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      if (diff < 604800) return `${Math.floor(diff / 86400)}d ago`;
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function shortPath(pwd) {
      const home = pwd.match(/^\/Users\/[^/]+/)?.[0] || '';
      if (home && pwd.startsWith(home)) return '~' + pwd.slice(home.length);
      return pwd;
    }

    function dirLabel(pwd) {
      const short = shortPath(pwd);
      const parts = short.split('/').filter(Boolean);
      if (parts.length <= 1) return short;
      return parts.slice(-2).join('/');
    }

    function toast(message, type = 'default') {
      const el = document.createElement('div');
      const colors = {
        default: 'bg-accent-glow border-border-bright text-bright',
        danger: 'bg-danger-dim border-danger/20 text-danger',
      };
      el.className = `toast-in px-4 py-2.5 rounded-lg border text-xs font-mono font-light ${colors[type] || colors.default}`;
      el.textContent = message;
      toastContainer.appendChild(el);
      setTimeout(() => {
        el.classList.remove('toast-in');
        el.classList.add('toast-out');
        setTimeout(() => el.remove(), 200);
      }, 2000);
    }

    function copyCmd(id) {
      const s = sessions.find(s => s.id === id);
      const dir = s ? s.pwd : '';
      const resume = dangerousMode
        ? `claude --resume ${id} --dangerously-skip-permissions`
        : `claude --resume ${id}`;
      const cmd = dir ? `cd ${dir} && ${resume}` : resume;
      navigator.clipboard.writeText(cmd).then(() => toast('Copied resume cmd'));
    }

    function confirmDelete(id) {
      if (deleteConfirm === id) { deleteConfirm = null; renderFiltered(); return; }
      deleteConfirm = id;
      renderFiltered();
    }

    function startRename(id, currentTitle) {
      const row = document.querySelector(`[data-id="${id}"]`);
      if (!row) return;
      const titleEl = row.querySelector('.session-title');
      const input = document.createElement('input');
      input.type = 'text';
      input.value = currentTitle;
      input.className = 'bg-raised border border-border-bright rounded px-2 py-0.5 text-sm text-bright font-normal w-64 focus:outline-none focus:border-accent';
      input.onclick = (e) => e.stopPropagation();

      const commit = async () => {
        const newTitle = input.value.trim();
        if (newTitle && newTitle !== currentTitle) {
          await fetch(`${API}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: newTitle }),
          });
          const s = sessions.find(s => s.id === id);
          if (s) s.title = newTitle;
          toast('Renamed');
        }
        renderFiltered();
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        if (e.key === 'Escape') renderFiltered();
      });
      input.addEventListener('blur', commit);

      titleEl.replaceWith(input);
      input.focus();
      input.select();
    }

    async function doDelete(id) {
      try {
        await fetch(`${API}/${id}`, { method: 'DELETE' });
        sessions = sessions.filter(s => s.id !== id);
        deleteConfirm = null;
        renderSidebar();
        renderFiltered();
        toast('Session deleted', 'danger');
      } catch (e) {
        toast('Delete failed', 'danger');
      }
    }

    function renderSidebar() {
      const dirMap = {};
      sessions.forEach(s => { dirMap[s.pwd] = (dirMap[s.pwd] || 0) + 1; });
      const dirs = Object.keys(dirMap).sort();

      navAllCount.textContent = sessions.length;

      const navAll = document.getElementById('nav-all');
      navAll.className = `sidebar-item w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-md text-xs font-light ${activeFilter === 'all' ? 'active text-bright' : 'text-muted'}`;

      mainTitle.textContent = activeFilter === 'all' ? 'All Sessions' : shortPath(activeFilter);

      sidebarDirs.innerHTML = '';
      dirs.forEach(dir => {
        const btn = document.createElement('button');
        const isActive = activeFilter === dir;
        btn.className = `sidebar-item w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-md text-xs font-light text-left ${isActive ? 'active text-bright' : 'text-muted'}`;
        btn.onclick = () => selectFilter(dir);
        btn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0">
            <path d="m15 10 5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/>
          </svg>
          <span class="truncate flex-1" title="${escHtml(shortPath(dir))}">${escHtml(dirLabel(dir))}</span>
          <span class="ml-auto font-mono text-[10px] shrink-0 ${isActive ? 'text-subtle' : 'text-muted/60'}">${dirMap[dir]}</span>
        `;
        sidebarDirs.appendChild(btn);
      });
    }

    function render(data) {
      listEl.innerHTML = '';

      if (sessions.length === 0) {
        emptyEl.classList.remove('hidden');
        noResultsEl.classList.add('hidden');
        countEl.textContent = '0 sessions';
        return;
      }
      emptyEl.classList.add('hidden');

      if (data.length === 0) {
        noResultsEl.classList.remove('hidden');
        countEl.textContent = `${sessions.length} session${sessions.length !== 1 ? 's' : ''}`;
        return;
      }
      noResultsEl.classList.add('hidden');
      countEl.textContent = `${data.length} session${data.length !== 1 ? 's' : ''}`;

      data.forEach((s, i) => {
        const row = document.createElement('div');
        row.className = 'session-row row-animate flex items-stretch group';
        row.style.animationDelay = `${i * 40}ms`;

        if (deleteConfirm === s.id) {
          row.innerHTML = `
            <div class="confirm-bar flex-1 flex items-center justify-between px-4 py-3">
              <span class="text-xs text-danger font-light">Delete "${s.title.length > 30 ? s.title.slice(0, 30) + '\u2026' : s.title}"?</span>
              <div class="flex items-center gap-2">
                <button onclick="doDelete('${s.id}')" class="px-3 py-1 rounded-md text-xs font-mono bg-danger-dim text-danger border border-danger/25 hover:bg-danger/20 transition-colors">confirm</button>
                <button onclick="confirmDelete('${s.id}')" class="px-3 py-1 rounded-md text-xs font-mono text-muted border border-border hover:border-border-bright transition-colors">cancel</button>
              </div>
            </div>
          `;
        } else {
          const showDir = activeFilter === 'all';
          row.setAttribute('data-id', s.id);
          row.innerHTML = `
            <div class="w-1/2 min-w-0 pr-4 pl-4 py-3 cursor-pointer border-r border-dashed border-border/40 flex items-center gap-3 group/open" onclick="navigateToSession('${s.id}')">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2.5 mb-0.5">
                  <span class="session-title text-sm text-bright font-normal truncate">${escHtml(s.title)}</span>
                  <span class="font-mono text-[11px] text-muted/70 shrink-0">${s.id.slice(0, 8)}</span>
                </div>
                ${showDir ? `<div class="font-mono text-[11px] text-muted/50 truncate">${escHtml(shortPath(s.pwd))}</div>` : ''}
              </div>
              <span class="text-[11px] text-muted font-mono hidden group-hover/open:flex items-center gap-1.5 shrink-0">
                open
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
              </span>
            </div>
            <div class="flex-1 cursor-pointer flex items-center justify-end pr-2 pl-4 py-3 group/copy" onclick="copyCmd('${s.id}')">
              <span class="text-[11px] text-muted/60 font-light group-hover/copy:hidden">${timeAgo(s.created_at)}</span>
              <span class="text-[11px] text-muted font-mono hidden group-hover/copy:flex items-center gap-1.5">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                copy
              </span>
            </div>
            <div class="w-24 flex items-center justify-end gap-1 row-actions py-3 pr-4">
              <button onclick="event.stopPropagation(); startRename('${s.id}', '${escHtml(s.title).replace(/'/g, "\\'")}')" title="Rename" class="p-1.5 rounded-md hover:bg-accent-glow text-muted hover:text-accent transition-all">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
                </svg>
              </button>
              <button onclick="confirmDelete('${s.id}')" title="Delete session" class="p-1.5 rounded-md hover:bg-danger-dim text-muted hover:text-danger transition-all">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
                </svg>
              </button>
            </div>
          `;
        }
        listEl.appendChild(row);
      });
    }

    function escHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // Detail view
    const detailView = document.getElementById('detail-view');
    const detailContent = document.getElementById('detail-content');
    const listView = document.querySelector('main:not(#detail-view)');
    const sidebar = document.querySelector('aside');

    function showListView() {
      detailView.classList.add('hidden');
      listView.classList.remove('hidden');
      sidebar.classList.remove('hidden');
    }

    function showDetailView() {
      detailView.classList.remove('hidden');
      listView.classList.add('hidden');
      sidebar.classList.add('hidden');
    }

    function navigateToSession(id) {
      history.pushState(null, '', `/session/${id}`);
      loadSessionDetail(id);
    }

    function navigateBack() {
      history.pushState(null, '', '/');
      showListView();
    }

    window.addEventListener('popstate', () => route());

    function formatTokens(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return n.toString();
    }

    async function loadSessionDetail(id) {
      showDetailView();
      detailContent.innerHTML = `<div class="py-24 text-center"><p class="text-muted text-sm font-light">Loading session...</p></div>`;

      try {
        const res = await fetch(`${API}/${id}/details`);
        if (!res.ok) {
          detailContent.innerHTML = `
            <div class="py-24 text-center">
              <p class="text-subtle text-sm font-light mb-2">No conversation data found</p>
              <p class="text-muted text-xs font-mono">JSONL file not found for this session</p>
              <button onclick="navigateBack()" class="mt-4 px-4 py-2 rounded-md text-xs font-mono border border-border text-muted hover:text-bright hover:border-border-bright transition-all">Back</button>
            </div>`;
          return;
        }
        const data = await res.json();
        renderDetail(data);
      } catch (e) {
        detailContent.innerHTML = `<div class="py-24 text-center"><p class="text-danger text-sm">Failed to load session</p></div>`;
      }
    }

    function renderDetail(data) {
      const s = data.stats;
      const toolEntries = Object.entries(s.tool_calls).sort((a, b) => b[1] - a[1]);

      detailContent.innerHTML = `
        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
          <button onclick="navigateBack()" class="p-1.5 rounded-md hover:bg-accent-glow text-muted hover:text-accent transition-all">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6"/>
            </svg>
          </button>
          <div class="flex-1 min-w-0">
            <h2 class="text-bright text-base font-medium truncate">${escHtml(data.title)}</h2>
            <div class="flex items-center gap-3 mt-0.5">
              <span class="font-mono text-[11px] text-muted/70">${data.id.slice(0, 8)}</span>
              <span class="font-mono text-[11px] text-muted/50">${escHtml(shortPath(data.pwd))}</span>
              <span class="text-[11px] text-muted/50">${timeAgo(data.created_at)}</span>
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
          <div class="bg-raised border border-border rounded-lg px-4 py-3">
            <div class="text-[10px] font-mono uppercase tracking-widest text-muted/60 mb-1">Messages</div>
            <div class="text-bright text-lg font-light">${s.user_messages + s.assistant_messages}</div>
            <div class="text-[11px] text-muted/60 font-mono">${s.user_messages} user / ${s.assistant_messages} assistant</div>
          </div>
          <div class="bg-raised border border-border rounded-lg px-4 py-3">
            <div class="text-[10px] font-mono uppercase tracking-widest text-muted/60 mb-1">Duration</div>
            <div class="text-bright text-lg font-light">${s.duration_minutes}m</div>
          </div>
          <div class="bg-raised border border-border rounded-lg px-4 py-3">
            <div class="text-[10px] font-mono uppercase tracking-widest text-muted/60 mb-1">Tokens</div>
            <div class="text-bright text-lg font-light">${formatTokens(s.total_input_tokens + s.total_output_tokens)}</div>
            <div class="text-[11px] text-muted/60 font-mono">${formatTokens(s.total_input_tokens)} in / ${formatTokens(s.total_output_tokens)} out</div>
          </div>
          <div class="bg-raised border border-border rounded-lg px-4 py-3">
            <div class="text-[10px] font-mono uppercase tracking-widest text-muted/60 mb-1">Tool Calls</div>
            <div class="text-bright text-lg font-light">${toolEntries.reduce((a, b) => a + b[1], 0)}</div>
            <div class="text-[11px] text-muted/60 font-mono truncate">${toolEntries.slice(0, 3).map(([n, c]) => n + ':' + c).join(' ')}</div>
          </div>
        </div>

        ${toolEntries.length > 0 ? `
        <div class="flex flex-wrap gap-1.5 mb-8">
          ${toolEntries.map(([name, count]) => `
            <span class="px-2 py-0.5 rounded-md bg-accent-glow border border-border text-[11px] font-mono text-muted">${escHtml(name)} <span class="text-bright">${count}</span></span>
          `).join('')}
        </div>` : ''}

        <!-- Conversation -->
        <div class="text-[10px] font-mono uppercase tracking-widest text-muted/60 mb-3 border-b border-border pb-2">Conversation</div>
        <div class="space-y-1">
          ${data.messages.map((m, i) => renderMessage(m, i)).join('')}
        </div>
      `;
    }

    function renderMessage(m, index) {
      const isUser = m.role === 'user';
      const toolBadges = (m.tools || []).map(t =>
        `<span class="px-1.5 py-0.5 rounded bg-accent-glow border border-border text-[10px] font-mono text-muted">${escHtml(t)}</span>`
      ).join('');

      // Truncate very long messages with expand
      const maxLen = 2000;
      const isLong = m.text.length > maxLen;
      const displayText = isLong ? m.text.slice(0, maxLen) : m.text;

      const rendered = isUser
        ? `<div class="text-sm text-primary/90 font-light whitespace-pre-wrap break-words leading-relaxed">${escHtml(displayText)}${isLong ? '<span class="text-muted">...</span>' : ''}</div>`
        : `<div class="text-sm text-primary/90 font-light break-words md-prose" id="msg-${index}">${typeof marked !== 'undefined' ? marked.parse(displayText) : escHtml(displayText)}${isLong ? '<span class="text-muted">...</span>' : ''}</div>`;

      return `
        <div class="row-animate flex gap-3 py-3 ${index > 0 ? 'border-t border-border/40' : ''}" style="animation-delay:${index * 20}ms">
          <div class="shrink-0 w-16 pt-0.5">
            <span class="text-[10px] font-mono uppercase tracking-wider ${isUser ? 'text-accent' : 'text-muted/70'}">${isUser ? 'you' : 'claude'}</span>
          </div>
          <div class="flex-1 min-w-0">
            ${toolBadges ? `<div class="flex flex-wrap gap-1 mb-1.5">${toolBadges}</div>` : ''}
            ${rendered}
            ${isLong ? `<button onclick="expandMsg(${index}, this)" data-full="${btoa(unescape(encodeURIComponent(m.text)))}" class="text-[11px] text-muted hover:text-accent font-mono mt-1 transition-colors">show more</button>` : ''}
          </div>
          <div class="shrink-0 w-16 text-right">
            <span class="text-[10px] text-muted/40 font-mono">${m.timestamp ? m.timestamp.slice(11, 16) : ''}</span>
          </div>
        </div>
      `;
    }

    function expandMsg(index, btn) {
      const full = decodeURIComponent(escape(atob(btn.dataset.full)));
      const el = document.getElementById('msg-' + index);
      if (el.classList.contains('md-prose') && typeof marked !== 'undefined') {
        el.innerHTML = marked.parse(full);
      } else {
        el.textContent = full;
      }
      btn.remove();
    }

    // Routing
    function route() {
      const path = decodeURIComponent(location.pathname);
      const sessionMatch = path.match(/^\/session\/([a-f0-9-]+)$/);
      if (sessionMatch) {
        loadSessionDetail(sessionMatch[1]);
      } else {
        showListView();
      }
    }

    async function load() {
      try {
        const res = await fetch(API);
        sessions = await res.json();

        const path = decodeURIComponent(location.pathname);
        const sessionMatch = path.match(/^\/session\/([a-f0-9-]+)$/);
        if (sessionMatch) {
          loadSessionDetail(sessionMatch[1]);
          renderSidebar();
          return;
        }

        const slug = path.replace(/^\//, '');
        if (slug) {
          const match = sessions.find(s => dirLabel(s.pwd) === slug);
          if (match) activeFilter = match.pwd;
        }
        renderSidebar();
        renderFiltered();
      } catch (e) {
        emptyEl.classList.remove('hidden');
      }
    }

    load();
  </script>
</body>
</html>
